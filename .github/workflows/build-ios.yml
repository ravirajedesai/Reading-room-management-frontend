name: Build iOS (iPhone)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  build-ios:
    name: Build Flutter iOS Application
    runs-on: macos-15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📁 Pre-create build directories & Disable SwiftPM rsync bug
        run: |
          mkdir -p build/ios/SourcePackages
          mkdir -p build/macos/SourcePackages
          flutter config --no-enable-swift-package-manager || true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🍎 Build iOS Release
        run: flutter build ios --release --no-codesign

      - name: 📦 Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 LibraryManagement-iOS.ipa Payload

      - name: 🚀 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibraryManagement-iOS-IPA
          path: LibraryManagement-iOS.ipa
          retention-days: 14
